name: Release

on:
  push:
    branches: [main]

# Never let two releases race for the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit and git tags
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # OIDC for npm trusted publishing — replaces NPM_TOKEN

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs history to diff against baseBranch

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Deliberately NO `registry-url`. That input makes setup-node write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
      # and with no token set that expands to an empty credential — npm then
      # sends it instead of performing the OIDC exchange, and the publish 404s.
      # Without the file, npm uses the default registry and authenticates over
      # OIDC as intended.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm,
      # but pinning the floor here means a runner image change can't silently
      # drop us back to token-only auth.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile

      # Two states, one action:
      #   changesets pending  -> opens/updates the "Version Packages" PR, publishes nothing
      #   versions already bumped (that PR was merged) -> runs `publish` for real
      #
      # So a release is triggered by MERGING a PR whose diff is exactly what ships.
      - uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN on purpose. `changeset publish` shells out to `npm publish`,
          # which picks up the OIDC credential from `id-token: write` above and
          # attaches a provenance attestation automatically.
          #
          # Provenance requires this repo to stay PUBLIC. npm verifies the
          # `repository_visibility` claim in the OIDC token and rejects a private
          # source with `E422 ... Unsupported GitHub Actions source repository
          # visibility: "private"` — at the very last step, after a full build and
          # after the signed statement is already in the transparency log. It reads
          # like an npm outage; it isn't. Make the repo public again, or drop this
          # line (publishing still works over OIDC, just without an attestation).
          #
          # If a release ever fails to *authenticate* — a 401/404 rather than this
          # 422 — the fallback is to keep `version` here and replace `publish` with
          # an explicit per-package `npm publish` step, which definitely honours OIDC.
          NPM_CONFIG_PROVENANCE: true
